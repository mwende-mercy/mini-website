<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | My Mini Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a class="logo" href="index.html">MyMiniSite</a>
    <button class="hamburger" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>
  <main>
    <h1>Contact Us</h1>
    <form id="contactForm" novalidate>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name">
      <div class="error" id="nameErr"></div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com">
      <div class="error" id="emailErr"></div>
      <label for="subject">Subject</label>
      <select id="subject" name="subject"><option>General enquiry</option><option>Feedback</option><option>Collaboration</option></select>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5"></textarea>
      <small id="charCount">0 characters</small>
      <div class="error" id="messageErr"></div>
      <button type="submit" class="btn">Send</button>
      <p id="formMessage" role="status"></p>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 My Mini Website. All rights reserved.</p>
    <p><a href="https://twitter.com" target="_blank" rel="noopener">Twitter</a>
       <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
       <a href="https://github.com" target="_blank" rel="noopener">GitHub</a></p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
